name: produccion

# El proceso diario ejecutado en los servidores de GitHub: reentrena con la historia hasta el 31/12/2024 y decide, día
# a día, si se pide cada producto en los 181 días de enero a junio de 2025. Se lanza a mano desde la pestaña Actions.
on:
  workflow_dispatch:

jobs:
  simulacion:
    # Sistema fijado para que un cambio de GitHub en ubuntu-latest no mueva las cifras sin avisar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Preparar la previsión de 2025 que usa la comprobación de principio a fin
        run: |
          for paso in 01_transformacion 02_variables 03_medida_2024 04_stock_de_seguridad 06_prevision_2025; do
            python -W error pipeline/$paso.py
          done
      - name: Reentrenar y ejecutar los 181 días
        run: python -W error produccion/simular_2025.py
      - name: Resumen de la ejecución
        run: |
          echo "## Simulación de enero a junio de 2025" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import csv
          filas = list(csv.reader(open('produccion/salidas_simulacion/registro.csv', encoding='utf-8')))
          print('| ' + ' | '.join(filas[0]) + ' |')
          print('|' + '---|' * len(filas[0]))
          for f in filas[1:]:
              print('| ' + ' | '.join(f) + ' |')
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar las salidas
        uses: actions/upload-artifact@v7
        with:
          name: salidas-produccion
          path: |
            produccion/salidas_simulacion/
            informes/despliegue.json
            modelos_simulacion/vigente/manifiesto.json
